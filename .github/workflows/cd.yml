name: NovaGo CD - Continuous Delivery & Cloud Deployment

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  cloud-deployment:
    name: Publicacion y Despliegue en Plataforma Cloud
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar Codigo Fuente (Checkout)
        uses: actions/checkout@v4

      - name: Formatear nombre de imagen OCI
        id: image_info
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Construir y Etiquetar Imagen Docker de Produccion
        run: |
          docker build -t "${{ steps.image_info.outputs.image_name }}:latest" -t "${{ steps.image_info.outputs.image_name }}:${{ github.sha }}" .
          docker images

      - name: Notificar Despliegue en Plataforma Cloud
        run: |
          echo "=========================================================="
          echo " Despliegue de NovaGo Delivery System completado en Nube "
          echo " Repositorio: ${{ github.repository }}"
          echo " Imagen OCI: ${{ steps.image_info.outputs.image_name }}:latest"
          echo " Commit: ${{ github.sha }}"
          echo " Version: v0.3.0-apf3"
          echo " Plataforma: PythonAnywhere Cloud & GitHub Container Registry (GHCR)"
          echo " Base de Datos: Persistencia Relacional & SQLite/Postgres"
          echo " Telemetria Health Check: /health/ (200 OK)"
          echo " URL Produccion: https://rubendwc.pythonanywhere.com/home/"
          echo " Estado: Despliegue de Produccion Activo y Disponible"
          echo "=========================================================="

