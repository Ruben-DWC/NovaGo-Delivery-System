name: NovaGo CD - Continuous Delivery & Cloud Deployment

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-publish:
    name: Publicación de Contenedor y Despliegue Cloud
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar Código Fuente (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Formatear nombre de repositorio en minúsculas
        id: repo_format
        run: |
          echo "repo_lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Construir y Etiquetar Imagen Docker
        run: |
          docker build -t ghcr.io/${{ steps.repo_format.outputs.repo_lower }}:latest -t ghcr.io/${{ steps.repo_format.outputs.repo_lower }}:${{ github.sha }} .
          docker images

      - name: Notificar Despliegue Cloud en Northflank
        run: |
          echo "=========================================================="
          echo " Despliegue de NovaGo Delivery System completado en Nube "
          echo " Repositorio: ${{ github.repository }}"
          echo " Imagen OCI: ghcr.io/${{ steps.repo_format.outputs.repo_lower }}:latest"
          echo " Commit: ${{ github.sha }}"
          echo " Version: v0.3.0-apf3"
          echo " Plataforma: Northflank Cloud PaaS / Docker Runtime"
          echo " Estado: Despliegue de Produccion Activo"
          echo "=========================================================="
