name: NovaGo CI - Continuous Integration Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-and-build:
    name: Linting, Checks, Pruebas Unitarias y Build Docker
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código Fuente (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Entorno Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Instalar Dependencias del Sistema y Librerías
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Auditoría de Sintaxis y Calidad de Código (Flake8)
        run: |
          # Detección temprana de errores de sintaxis y variables no definidas
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Advertencias de estilo (PEP 8) con límite de complejidad ciclomática
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Verificación de Integridad de Django (System Checks)
        run: |
          python manage.py check

      - name: Verificación de Consistencia de Migraciones ORM
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Ejecución de Suite de Pruebas Automatizadas (Pytest)
        run: |
          pytest -v --tb=short

      - name: Construir Imagen Docker y Validar Health Check
        run: |
          docker build -t novago-delivery:${{ github.sha }} .
          docker run -d --name novago_ci_container -p 8000:8000 \
            -e DEBUG=True \
            -e SECRET_KEY=ci-test-key-novago-apf3 \
            -e ALLOWED_HOSTS=* \
            novago-delivery:${{ github.sha }}
          
          # Esperar inicialización del servidor Gunicorn
          sleep 6
          docker logs novago_ci_container
          
          # Validar respuesta HTTP 200 y JSON en endpoint /health/
          curl -f http://127.0.0.1:8000/health/ || exit 1
          echo "Contenedor Docker y endpoint /health/ validados exitosamente en CI!"
