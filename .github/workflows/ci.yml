name: NovaGo CI - Continuous Integration Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-and-lint:
    name: Linting, Checks y Pruebas Unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código Fuente (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Entorno Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Instalar Dependencias del Sistema y Librerías
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Auditoría de Sintaxis y Calidad de Código (Flake8)
        run: |
          # Detección temprana de errores de sintaxis y variables no definidas
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Advertencias de estilo (PEP 8) con límite de complejidad ciclomática
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Verificación de Integridad de Django (System Checks)
        run: |
          python manage.py check

      - name: Verificación de Consistencia de Migraciones ORM
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Ejecución de Suite de Pruebas Automatizadas (Pytest)
        run: |
          pytest -v --tb=short

  docker-build-test:
    name: Construcción y Verificación de Contenedor Docker
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Descargar Código Fuente (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Construir Imagen Docker de Producción
        run: |
          docker build -t novago-delivery:${{ github.sha }} .

      - name: Validar Ejecución de Contenedor y Health Check
        run: |
          docker run -d --name novago_ci_container -p 8000:8000 \
            -e DEBUG=True \
            -e SECRET_KEY=ci-test-key-novago-apf3 \
            -e ALLOWED_HOSTS=* \
            novago-delivery:${{ github.sha }}
          
          # Esperar a que el servidor inicialice
          sleep 5
          
          # Probar que el endpoint /health/ responda HTTP 200
          docker logs novago_ci_container
          curl -f http://127.0.0.1:8000/health/ || exit 1
          
          echo "Contenedor Docker validado y operativo exitosamente!"
