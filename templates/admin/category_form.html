{% extends 'admin/base_admin.html' %}

{% block title %}Categoría - NovaGo{% endblock %}

{% block extra_css %}
{{ block.super }}
<style>
    .admin-category-form-page { padding: 1.2rem; max-width: 760px; }
    .admin-category-form-title { margin: 0 0 0.8rem; color: var(--text); font-size: 1.35rem; }
    .admin-category-form {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--bg-secondary, #f5f9ff);
        padding: 1rem;
        display: grid;
        gap: 0.75rem;
        box-shadow: 0 18px 36px -32px rgba(15, 23, 42, 0.5);
    }
    html[data-theme='dark'] .admin-category-form { background: rgba(15, 23, 42, 0.64); border-color: rgba(148, 163, 184, 0.24); }
    .admin-category-form p { margin: 0; display: grid; gap: 0.35rem; }
    .admin-category-form input, .admin-category-form select, .admin-category-form textarea { width: 100%; padding: 0.58rem; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
    .admin-category-form-actions { display: flex; gap: 0.6rem; }
    .admin-category-form-save {
        padding: 0.56rem 0.78rem;
        border-radius: 10px;
        border: none;
        background: linear-gradient(120deg, #0ea5e9, #0284c7);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
    }
    .admin-category-form-cancel {
        padding: 0.56rem 0.78rem;
        border-radius: 10px;
        border: 1px solid var(--line);
        text-decoration: none;
        color: var(--text);
    }
</style>
{% endblock %}

{% block admin_content %}
<section class="admin-category-form-page">
    <h1 class="admin-category-form-title"><i class="fas fa-tags"></i> {{ view.object|default:'Nueva categoría' }}</h1>
    <form method="post" class="admin-category-form">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="admin-category-form-actions">
            <button type="submit" class="admin-category-form-save">Guardar</button>
            <a href="{% url 'users:admin_categories' %}" class="admin-category-form-cancel">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
